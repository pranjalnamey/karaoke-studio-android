name: Deploy Karaoke Studio Web to Azure Static Web Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/azure-karaoke-studio-web.yml"

jobs:
  deploy:
    if: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KARAOKE_STUDIO != '' }}
    runs-on: ubuntu-latest
    name: Deploy web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KARAOKE_STUDIO }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/web"
          api_location: ""
          output_location: ""
          skip_app_build: true
