plugins {
    id 'com.android.application'
}

android {
    namespace 'com.seekgodtakeall.karaokestudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.seekgodtakeall.karaokestudio'
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName '3.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}


dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
}
